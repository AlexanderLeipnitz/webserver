api:
  dashboard: false

metrics:
  prometheus:
    addRoutersLabels: true

certificatesResolvers:
  http_resolver:
    acme:
      email: ${LETSENCRYPT_EMAIL}
      storage: "/etc/traefik/acme_letsencrypt.json"
      httpChallenge:
        entryPoint: web
  tls_resolver:
    acme:
      email: ${LETSENCRYPT_EMAIL}
      storage: "/etc/traefik/tls_letsencrypt.json"
      tlsChallenge: {}

entryPoints:
  ping:
    address: ':88'
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ':443'
    http3: {}
    http:
      middlewares:
        - crowdsec@file
        - default@file

ping:
  entryPoint: "ping"

global:
  checknewversion: true
  sendanonymoususage: false

providers:
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: "proxy"
  file:
    directory: "/etc/traefik/dynamic_conf"
    watch: true
  providersThrottleDuration: 10s

log:
  level: INFO
  filePath: "/var/log/traefik/traefik.log"
  format: json
  maxSize: 10
  maxBackups: 10
  maxAge: 14

accessLog:
  format: json
  filePath: "/var/log/traefik/access.log"
  fields:
    defaultMode: keep
    names:
      ClientUsername: drop
    headers:
      defaultMode: keep
      names:
        # ✅ Security-essentiell:
        User-Agent: keep
        X-Forwarded-For: keep
        X-Real-IP: keep
        CF-Connecting-IP: keep
        Referer: keep
        Content-Type: keep
        Accept: keep
        # ✅ KRITISCH: REDACT statt DROP
        Authorization: redact        # Zeigt "REDACTED" wenn Header vorhanden
        Cookie: redact               # Zeigt "REDACTED" wenn Cookie vorhanden
        Set-Cookie: redact

experimental:
  plugins:
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.5.1
